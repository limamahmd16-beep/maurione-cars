name: Build welcome JPEG

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-welcome-jpeg.yml'
      - 'public/welcome-approved-site.svg'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract real JPEG from approved artwork
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, re
          src = Path('public/welcome-approved-site.svg').read_text(encoding='utf-8')
          m = re.search(r'data:image/jpeg;base64,([^"\']+)', src)
          if not m:
              raise SystemExit('JPEG data not found')
          data = base64.b64decode(m.group(1))
          if not data.startswith(b'\xff\xd8\xff'):
              raise SystemExit('Invalid JPEG')
          Path('public/welcome-approved.jpg').write_bytes(data)
          print('JPEG bytes:', len(data))
          PY
      - name: Commit JPEG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/welcome-approved.jpg
          if git diff --cached --quiet; then
            echo "No change"
          else
            git commit -m "Add real welcome JPEG"
            git push
          fi
