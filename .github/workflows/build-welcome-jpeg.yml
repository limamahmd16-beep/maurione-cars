name: Build welcome JPEG

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-welcome-jpeg.yml'
      - 'public/q60/*.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild verified showroom JPEG from chunks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64

          names = ['00a.txt', '00b.txt', '01.txt', '02.txt', '03.txt', '04.txt']
          encoded = ''.join(''.join(Path('public/q60', name).read_text().split()) for name in names)
          data = base64.b64decode(encoded, validate=True)

          if len(data) != 40407:
              raise SystemExit(f'Unexpected JPEG size: {len(data)}')
          if not data.startswith(b'\xff\xd8\xff') or not data.endswith(b'\xff\xd9'):
              raise SystemExit('Invalid JPEG output')

          Path('public/showroom-720.jpg').write_bytes(data)
          print('JPEG bytes:', len(data))
          PY
      - name: Commit showroom JPEG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/showroom-720.jpg
          if git diff --cached --quiet; then
            echo "No change"
          else
            git commit -m "Rebuild verified welcome showroom JPEG"
            git push
          fi