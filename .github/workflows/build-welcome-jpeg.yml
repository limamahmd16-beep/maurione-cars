name: Build welcome JPEG

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-welcome-jpeg.yml'
      - 'public/welcome-parts/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild approved artwork as a real JPEG
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          import base64, io
          from PIL import Image

          names = ['00','01','02','03','04a','04b','04c','05']
          encoded = ''.join(Path(f'public/welcome-parts/{name}.txt').read_text().strip() for name in names)
          data = base64.b64decode(encoded)
          if data[:4] != b'RIFF' or data[8:12] != b'WEBP':
              raise SystemExit('Invalid reconstructed WEBP')

          im = Image.open(io.BytesIO(data)).convert('RGB')
          im.save('public/welcome-approved.jpg', 'JPEG', quality=92, optimize=True, progressive=True)
          out = Path('public/welcome-approved.jpg').read_bytes()
          if not out.startswith(b'\xff\xd8\xff'):
              raise SystemExit('Invalid output JPEG')
          print('JPEG size:', len(out), 'dimensions:', im.size)
          PY
      - name: Commit JPEG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/welcome-approved.jpg
          if git diff --cached --quiet; then
            echo "No change"
          else
            git commit -m "Add real approved welcome JPEG"
            git push
          fi
