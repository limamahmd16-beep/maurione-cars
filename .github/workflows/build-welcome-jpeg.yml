name: Build welcome JPEG

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-welcome-jpeg.yml'
      - 'public/maurione-welcome-approved-exact.webp'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Convert approved binary artwork to JPEG
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          source = Path('public/maurione-welcome-approved-exact.webp')
          with Image.open(source) as im:
              print('SOURCE:', im.format, im.size, im.mode)
              out = im.convert('RGB')
              out.save('public/welcome-approved.jpg', 'JPEG', quality=94, optimize=True, progressive=True)
          data = Path('public/welcome-approved.jpg').read_bytes()
          if not data.startswith(b'\xff\xd8\xff'):
              raise SystemExit('Invalid JPEG output')
          print('JPEG bytes:', len(data))
          PY
      - name: Commit JPEG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/welcome-approved.jpg
          if git diff --cached --quiet; then
            echo "No change"
          else
            git commit -m "Add real approved welcome JPEG"
            git push
          fi
