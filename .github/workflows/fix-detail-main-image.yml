name: Fix detail main image renderer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-detail-main-image.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace only the main detail image renderer
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/AppExact.jsx')
          s = p.read_text()
          old = '''{imgs[i]?<img src={imgs[i]} alt=""/>:<CarFront/>}'''
          new = '''{imgs[i]?<div className="mxGalleryImage" role="img" aria-label={`${car.brand||''} ${car.model||''}`} style={{width:'100%',height:'100%',backgroundImage:`url(${imgs[i]})`,backgroundRepeat:'no-repeat',backgroundPosition:'center center',backgroundSize:'contain'}}/>:<CarFront/>}'''
          count = s.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one main-image renderer, found {count}')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit minimal gallery fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/AppExact.jsx
          git commit -m "Render detail main image independently from img CSS"
          git push
