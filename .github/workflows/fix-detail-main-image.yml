name: Fix detail main image renderer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-detail-main-image.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render the selected car photo as one direct image
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/AppExact.jsx')
          s = p.read_text()
          old = '''{imgs[i]?<div className="mxGalleryImage" style={{width:'calc(100% - 12px)',height:'calc(100% - 12px)',display:'flex',alignItems:'center',justifyContent:'center',overflow:'hidden',borderRadius:'18px',background:'#f5f6f7',margin:'auto'}}><img src={imgs[i]} alt={`${car.brand||''} ${car.model||''}`} style={{display:'block',width:'auto',height:'auto',maxWidth:'100%',maxHeight:'100%',objectFit:'contain',objectPosition:'center',borderRadius:'16px'}}/></div>:<CarFront/>}'''
          new = '''{imgs[i]?<img className="mxMainPhoto" src={imgs[i]} alt={`${car.brand||''} ${car.model||''}`} draggable="false"/>:<CarFront/>}'''
          count = s.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one nested main-image renderer, found {count}')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit direct gallery image fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/AppExact.jsx
          git commit -m "Use one direct image for car detail gallery"
          git push
