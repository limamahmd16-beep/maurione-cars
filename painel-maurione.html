<style>
*{box-sizing:border-box}html,body,#root{min-height:100%;margin:0}body{font-family:Arial,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f6f7f8;color:#111820}.mxDirectAccess{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px}.mxDirectCard{width:min(100%,430px);padding:32px 24px 24px;border:1px solid #e5e8ec;border-radius:28px;background:#fff;box-shadow:0 22px 70px rgba(15,23,42,.10);text-align:center}.mxDirectLogo{font-size:36px;font-weight:950;letter-spacing:-1.8px;direction:ltr;margin-bottom:22px}.mxDirectLogo b{color:#0b0d10}.mxDirectLogo i{color:#f4662d;font-style:normal}.mxDirectCard h1{margin:0 0 7px;font-size:25px}.mxDirectCard>p{margin:0 0 18px;color:#7c8490;font-size:13px;line-height:1.6}.mxDirectLanguage{display:flex;align-items:center;gap:10px;margin:0 0 14px;text-align:start}.mxDirectLanguage label{font-size:11px;font-weight:900;color:#707984;white-space:nowrap}.mxDirectLanguage select{width:100%;height:44px;border:1px solid #dfe4e9;border-radius:12px;background:#fff;color:#12171d;padding:0 12px;font-size:14px;font-weight:800;outline:none}.mxDirectLanguage select:focus{border-color:#f4662d;box-shadow:0 0 0 3px rgba(244,102,45,.10)}.mxDirectTabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#f1f3f5;border-radius:13px;padding:5px;margin-bottom:14px}.mxDirectTabs button{height:42px;border:0;border-radius:9px;background:transparent;color:#707984;font-weight:900}.mxDirectTabs button.on{background:#fff;color:#ed642b;box-shadow:0 3px 12px rgba(15,23,42,.06)}#mxDirectLoginForm{display:grid;gap:11px}#mxDirectLoginForm input{width:100%;height:52px;border:1px solid #dfe4e9;border-radius:14px;background:#fff;color:#12171d;padding:0 14px;font-size:16px;outline:none;text-align:left}html[dir='rtl'] #mxDirectLoginForm input{text-align:right}#mxDirectLoginForm input:focus{border-color:#f4662d;box-shadow:0 0 0 3px rgba(244,102,45,.10)}#mxDirectSubmit{height:52px;border:0;border-radius:14px;background:#f4662d;color:#fff;font-size:15px;font-weight:950}#mxDirectSubmit:disabled{opacity:.6}.mxDirectError{padding:10px 12px;border:1px solid #efcac5;border-radius:12px;background:#fff2f0;color:#9e4138;font-size:12px;line-height:1.5;text-align:start}.mxDirectNote{margin-top:15px!important;margin-bottom:0!important;font-size:11px!important;color:#9aa1aa!important}html[data-theme='dark'] body{background:#0d0f12;color:#f5f6f7}html[data-theme='dark'] .mxDirectCard{background:#15181c;border-color:#30353c;box-shadow:0 22px 70px rgba(0,0,0,.38)}html[data-theme='dark'] .mxDirectLogo b,html[data-theme='dark'] .mxDirectCard h1{color:#f5f6f7}html[data-theme='dark'] .mxDirectCard>p,html[data-theme='dark'] .mxDirectLanguage label{color:#9ca3ad}html[data-theme='dark'] .mxDirectLanguage select,html[data-theme='dark'] #mxDirectLoginForm input{background:#111419;border-color:#343a42;color:#f5f6f7}html[data-theme='dark'] .mxDirectTabs{background:#101318}html[data-theme='dark'] .mxDirectTabs button.on{background:#252a31;color:#ff824e}@media(max-width:480px){.mxDirectAccess{padding:16px}.mxDirectCard{padding:28px 18px 20px;border-radius:24px}.mxDirectLogo{font-size:34px}}
