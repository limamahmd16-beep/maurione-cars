    <script type="application/ld+json" id="maurione-site-schema">
      {
        "@context": "https://schema.org",
        "@type": "AutoDealer",
        "name": "MauriOne",
        "url": "https://maurione-cars.vercel.app/",
        "logo": "https://res.cloudinary.com/bjlglhaw/image/upload/v1788117338/maurione-app-icon.png",
        "image": "https://res.cloudinary.com/bjlglhaw/image/upload/v1788117338/maurione-app-icon.png",
        "areaServed": {"@type":"Country","name":"Angola"},
        "currenciesAccepted": "AOA",
        "description": "Mercado MauriOne de carros selecionados em Angola."
      }
    </script>
    <script>
      (()=>{
        const key='maurione_portuguese_primary_v1';
        try{
          if(localStorage.getItem(key)!=='1'){
            localStorage.setItem('maurione_language','pt');
            localStorage.setItem('maurione_admin_language','pt');
            localStorage.setItem(key,'1');
          }
          localStorage.setItem('maurione_market','AO');
        }catch(e){}
        document.documentElement.lang='pt-AO';document.documentElement.dir='ltr';
        const admin=location.pathname==='/admin'||location.pathname.startsWith('/admin/');
        window.__MAURIONE_ADMIN_PATH__=admin;
        if(!admin)return;
        document.title='Painel de controlo | MauriOne';
        const manifest=document.getElementById('mxAppManifest');
        if(manifest)manifest.href='/admin-manifest.webmanifest?v=10';
        const appleTitle=document.querySelector('meta[name="apple-mobile-web-app-title"]');
        if(appleTitle)appleTitle.content='Painel MauriOne';
      })();
    </script>
    <link rel="stylesheet" href="/standalone-detail-fix.css?v=1" />
    <link rel="stylesheet" href="/card-layout-refine.css?v=4" />
    <style>
      html,body,#root{min-height:100%;background:#fff;margin:0}
      .mxAdminBoot{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box;background:#fff;font-family:Arial,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .mxAdminBootCard{width:min(100%,430px);box-sizing:border-box;padding:30px 24px 24px;border:1px solid #eceef1;border-radius:28px;background:#fff;box-shadow:0 20px 60px rgba(15,23,42,.10);text-align:center}
      .mxAdminBootLogo{font-size:34px;line-height:1;font-weight:900;direction:ltr;margin-bottom:28px;letter-spacing:-1.5px}.mxAdminBootLogo b{color:#090909}.mxAdminBootLogo i{color:#ff5a12;font-style:normal}
      .mxAdminBootCard h1{font-size:24px;margin:0 0 8px;color:#111}.mxAdminBootCard p{margin:0;color:#777d86;font-size:14px;line-height:1.7}
      .mxAdminBootCard button{width:100%;height:50px;margin-top:18px;border:0;border-radius:15px;background:#ff5a12;color:#fff;font-size:16px;font-weight:900}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import('/src/primary-language.js');
      import('/src/angola-market.js');
      const admin=window.__MAURIONE_ADMIN_PATH__===true;

      function loadClassic(src){
        return new Promise((resolve,reject)=>{
          const script=document.createElement('script');script.src=src;script.onload=resolve;script.onerror=reject;document.body.appendChild(script);
        });
      }

      function adminBoot(message='A iniciar o painel de controlo...',failed=false){
        const root=document.getElementById('root');if(!root)return;
        root.innerHTML=`<main class="mxAdminBoot" dir="ltr"><section class="mxAdminBootCard"><div class="mxAdminBootLogo"><b>Mauri</b><i>One</i></div><h1>Painel de controlo</h1><p>${message}</p>${failed?'<button type="button" id="mxAdminRetry">Recarregar</button>':''}</section></main>`;
        document.getElementById('mxAdminRetry')?.addEventListener('click',()=>location.reload());
      }

      if(admin){
        adminBoot();
        import('/admin-main.jsx').catch(error=>{console.error('MauriOne admin entry failed',error);adminBoot('Não foi possível carregar o painel de controlo. Toque em recarregar.',true)});
      }else{
        Promise.all([
          loadClassic('/welcome-loader.js?v=29'),
          loadClassic('/featured-badge-position.js?v=6'),
          loadClassic('/whatsapp-car-inquiry.js?v=3'),
          loadClassic('/seo-manager.js?v=3'),
          import('/src/private-admin-guard.js?v=3'),
          import('/src/car-analytics.js?v=1')
        ]).finally(()=>import('/main.jsx'));
      }
    </script>
    <!-- angola-primary-market-20260902 -->
  </body>
