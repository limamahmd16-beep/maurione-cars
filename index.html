<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MauriOne" />
    <title>MauriOne السيارات | معرض السيارات</title>
    <meta name="description" content="MauriOne السيارات — معرض سيارات مختارة بعناية، تفاصيل واضحة وتواصل مباشر." />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=3" />
    <link rel="icon" type="image/png" href="/apple-touch-icon.png?v=3" />
    <link id="mxAppManifest" rel="manifest" href="/manifest.webmanifest?v=3" />
    <script>
      (()=>{
        const admin=location.pathname==='/admin'||location.pathname.startsWith('/admin/');
        window.__MAURIONE_ADMIN_PATH__=admin;
        if(!admin)return;
        document.title='لوحة التحكم | MauriOne';
        const manifest=document.getElementById('mxAppManifest');
        if(manifest)manifest.href='/admin-manifest.webmanifest?v=1';
        const appleTitle=document.querySelector('meta[name="apple-mobile-web-app-title"]');
        if(appleTitle)appleTitle.content='لوحة التحكم';
      })();
    </script>
    <link rel="stylesheet" href="/standalone-detail-fix.css?v=1" />
    <link rel="stylesheet" href="/card-layout-refine.css?v=3" />
    <style>html,body,#root{min-height:100%;background:#fff;margin:0}</style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (()=>{
        const admin=window.__MAURIONE_ADMIN_PATH__===true;
        if(admin)return;
        const add=(src,type)=>{
          const script=document.createElement('script');
          script.src=src;
          if(type)script.type=type;
          document.body.appendChild(script);
        };
        add('/welcome-loader.js?v=29');
        add('/featured-badge-position.js?v=5');
        add('/whatsapp-car-inquiry.js?v=1');
        add('/src/private-admin-guard.js?v=4','module');
        add('/src/car-analytics.js?v=1','module');
      })();
    </script>
    <script type="module" src="/main.jsx"></script>
    <!-- stable-recovery-20260827 -->
  </body>
</html>
