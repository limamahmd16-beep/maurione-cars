<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MauriOne" />
    <title>MauriOne السيارات | معرض السيارات</title>
    <meta name="description" content="MauriOne السيارات — معرض سيارات مختارة بعناية، تفاصيل واضحة وتواصل مباشر." />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=3" />
    <link rel="icon" type="image/png" href="/apple-touch-icon.png?v=3" />
    <link id="mxAppManifest" rel="manifest" href="/manifest.webmanifest?v=3" />
    <script>
      (()=>{
        const admin=location.pathname==='/admin'||location.pathname.startsWith('/admin/');
        window.__MAURIONE_ADMIN_PATH__=admin;
        if(!admin)return;
        document.title='لوحة التحكم | MauriOne';
        const manifest=document.getElementById('mxAppManifest');
        if(manifest)manifest.href='/admin-manifest.webmanifest?v=2';
        const appleTitle=document.querySelector('meta[name="apple-mobile-web-app-title"]');
        if(appleTitle)appleTitle.content='لوحة التحكم';
      })();
    </script>
    <link rel="stylesheet" href="/standalone-detail-fix.css?v=1" />
    <link rel="stylesheet" href="/card-layout-refine.css?v=3" />
    <style>
      html,body,#root{min-height:100%;background:#fff;margin:0}
      .mxAdminBoot{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box;background:#fff;font-family:Arial,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .mxAdminBootCard{width:min(100%,430px);box-sizing:border-box;padding:30px 24px 24px;border:1px solid #eceef1;border-radius:28px;background:#fff;box-shadow:0 20px 60px rgba(15,23,42,.10);text-align:center}
      .mxAdminBootLogo{font-size:34px;line-height:1;font-weight:900;direction:ltr;margin-bottom:28px;letter-spacing:-1.5px}.mxAdminBootLogo b{color:#090909}.mxAdminBootLogo i{color:#ff5a12;font-style:normal}
      .mxAdminBootCard h1{font-size:24px;margin:0 0 8px;color:#111}.mxAdminBootCard p{margin:0;color:#777d86;font-size:14px;line-height:1.7}
      .mxAdminBootCard button{width:100%;height:50px;margin-top:18px;border:0;border-radius:15px;background:#ff5a12;color:#fff;font-size:16px;font-weight:900}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      const admin=window.__MAURIONE_ADMIN_PATH__===true;

      function loadClassic(src){
        return new Promise((resolve,reject)=>{
          const script=document.createElement('script');
          script.src=src;
          script.onload=resolve;
          script.onerror=reject;
          document.body.appendChild(script);
        });
      }

      function adminBoot(message='جارٍ تشغيل لوحة التحكم...',failed=false){
        const root=document.getElementById('root');
        if(!root)return;
        root.innerHTML=`<main class="mxAdminBoot" dir="rtl"><section class="mxAdminBootCard"><div class="mxAdminBootLogo"><b>Mauri</b><i>One</i></div><h1>لوحة التحكم</h1><p>${message}</p>${failed?'<button type="button" id="mxAdminRetry">إعادة التحميل</button>':''}</section></main>`;
        document.getElementById('mxAdminRetry')?.addEventListener('click',()=>location.reload());
      }

      if(admin){
        adminBoot();
        import('/admin-main.jsx').catch(error=>{
          console.error('MauriOne admin entry failed',error);
          adminBoot('تعذر تحميل لوحة التحكم. اضغط إعادة التحميل.',true);
        });
      }else{
        Promise.all([
          loadClassic('/welcome-loader.js?v=29'),
          loadClassic('/featured-badge-position.js?v=5'),
          loadClassic('/whatsapp-car-inquiry.js?v=1'),
          import('/src/private-admin-guard.js?v=3'),
          import('/src/car-analytics.js?v=1')
        ]).finally(()=>import('/main.jsx'));
      }
    </script>
    <!-- stable-recovery-20260829-admin-bootstrap-v2 -->
  </body>
</html>
