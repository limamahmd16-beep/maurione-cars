<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MauriOne" />
    <title>MauriOne السيارات | معرض السيارات</title>
    <meta name="description" content="MauriOne السيارات — معرض سيارات مختارة بعناية، تفاصيل واضحة وتواصل مباشر." />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=3" />
    <link rel="icon" type="image/png" href="/apple-touch-icon.png?v=3" />
    <link rel="manifest" href="/manifest.webmanifest?v=3" />
    <style>html,body,#root{min-height:100%;background:#fff;margin:0}</style>
  </head>
  <body>
    <div id="root"></div>
    <script src="/welcome-loader.js?v=29"></script>
    <script type="module" src="/src/admin-insights-v3.js"></script>
    <script type="module" src="/main.jsx"></script>
    <style id="mx-detail-image-final">
      .mxDetail .mxGallery{
        position:relative!important;
        display:block!important;
        padding:6px!important;
        overflow:hidden!important;
        border-radius:24px!important;
      }
      .mxDetail .mxGallery>img.mxMainPhoto{
        position:absolute!important;
        top:6px!important;
        right:6px!important;
        bottom:6px!important;
        left:6px!important;
        display:block!important;
        width:calc(100% - 12px)!important;
        height:calc(100% - 12px)!important;
        max-width:none!important;
        max-height:none!important;
        margin:0!important;
        padding:0!important;
        object-fit:contain!important;
        object-position:center center!important;
        border-radius:18px!important;
        opacity:1!important;
        visibility:visible!important;
        transform:none!important;
        z-index:5!important;
        background:#f5f6f7!important;
      }
      @media(max-width:560px){
        .mxDetail .mxGallery{padding:5px!important;border-radius:23px!important}
        .mxDetail .mxGallery>img.mxMainPhoto{
          top:5px!important;
          right:5px!important;
          bottom:5px!important;
          left:5px!important;
          width:calc(100% - 10px)!important;
          height:calc(100% - 10px)!important;
          border-radius:17px!important;
        }
      }
    </style>
  </body>
</html>
