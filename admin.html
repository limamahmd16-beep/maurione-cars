    <link rel="icon" type="image/png" href="https://res.cloudinary.com/bjlglhaw/image/upload/v1788117338/maurione-app-icon.png" />

    <script>
      (()=>{
        try{
          if(localStorage.getItem('maurione_portuguese_primary_v1')!=='1'){
            localStorage.setItem('maurione_language','pt');
            localStorage.setItem('maurione_admin_language','pt');
            localStorage.setItem('maurione_portuguese_primary_v1','1');
          }
          localStorage.setItem('maurione_market','AO');
        }catch(e){}
        document.documentElement.lang='pt-AO';document.documentElement.dir='ltr';
        const key='maurione_admin_theme';let choice='system',theme='light';
        try{const saved=localStorage.getItem(key);if(saved==='dark'||saved==='light'||saved==='system')choice=saved}catch(e){}
        if(choice==='dark')theme='dark';else if(choice==='light')theme='light';else if(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)theme='dark';
        document.documentElement.dataset.theme=theme;document.documentElement.dataset.adminThemeChoice=choice;document.documentElement.style.colorScheme=theme;
        const meta=document.querySelector('meta[name="theme-color"]');if(meta)meta.setAttribute('content',theme==='dark'?'#0d0f12':'#ffffff');
      })();
    </script>
    <style>
      html,body,#root{min-height:100%;background:#fff;margin:0}
      .mxAdminBoot{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box;background:#fff;font-family:Arial,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .mxAdminBootCard{width:min(100%,430px);box-sizing:border-box;padding:30px 24px 24px;border:1px solid #eceef1;border-radius:28px;background:#fff;box-shadow:0 20px 60px rgba(15,23,42,.10);text-align:center}
      .mxAdminBootLogo{font-size:34px;line-height:1;font-weight:900;direction:ltr;margin-bottom:28px;letter-spacing:-1.5px}.mxAdminBootLogo b{color:#090909}.mxAdminBootLogo i{color:#ff5a12;font-style:normal}
      .mxAdminBootCard h1{font-size:24px;margin:0 0 8px;color:#111}.mxAdminBootCard p{margin:0;color:#777d86;font-size:14px;line-height:1.7}
      html[data-theme='dark'],html[data-theme='dark'] body,html[data-theme='dark'] #root{background:#0d0f12!important;color:#f4f5f7!important}
      html[data-theme='dark'] .mxAdminBoot{background:#0d0f12!important}
      html[data-theme='dark'] .mxAdminBootCard{background:#15181c!important;border-color:#2c3138!important;box-shadow:0 20px 60px rgba(0,0,0,.38)!important}
      html[data-theme='dark'] .mxAdminBootLogo b{color:#f7f7f8!important}
      html[data-theme='dark'] .mxAdminBootCard h1{color:#f7f7f8!important}
      html[data-theme='dark'] .mxAdminBootCard p{color:#9ca3ad!important}
    </style>
    <script>if(location.pathname==='/admin.html') history.replaceState({},'',`/admin${location.search}${location.hash}`);</script>
  </head>
  <body>
    <div id="root"><main class="mxAdminBoot" dir="ltr"><section class="mxAdminBootCard"><div class="mxAdminBootLogo"><b>Mauri</b><i>One</i></div><h1>Painel de controlo</h1><p>A iniciar o painel de controlo...</p></section></main></div>
    <script>
      document.addEventListener('click',function(event){
        var target=event.target instanceof Element?event.target:null;if(!target)return;
        var action=target.closest('.mxAdminActions button');var back=target.closest('.mxAdminHeader > button:first-child');
        var text=String(action&&action.textContent||'');var openSite=action&&(text.includes('فتح الموقع')||text.includes('Abrir site'));
        if(!openSite&&!back)return;event.preventDefault();event.stopPropagation();if(event.stopImmediatePropagation)event.stopImmediatePropagation();
        try{localStorage.setItem('maurione_admin_preview_home','1')}catch(e){}window.location.assign('/?from=admin-preview&t='+Date.now());
      },true);
    </script>

    <script type="module" src="/src/admin-terminology.js"></script>
  </body>
