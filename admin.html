<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="لوحة التحكم" />
    <title>لوحة التحكم | MauriOne</title>
    <meta name="description" content="لوحة التحكم الخاصة بمالك MauriOne" />
    <link rel="apple-touch-icon" href="/maurione-app-icon.svg?v=1" />
    <link rel="icon" type="image/svg+xml" href="/maurione-app-icon.svg?v=1" />
    <link rel="manifest" href="/admin-manifest.webmanifest?v=7" />
    <style>
      html,body,#root{min-height:100%;background:#fff;margin:0}
      .mxAdminBoot{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box;background:#fff;font-family:Arial,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .mxAdminBootCard{width:min(100%,430px);box-sizing:border-box;padding:30px 24px 24px;border:1px solid #eceef1;border-radius:28px;background:#fff;box-shadow:0 20px 60px rgba(15,23,42,.10);text-align:center}
      .mxAdminBootLogo{font-size:34px;line-height:1;font-weight:900;direction:ltr;margin-bottom:28px;letter-spacing:-1.5px}.mxAdminBootLogo b{color:#090909}.mxAdminBootLogo i{color:#ff5a12;font-style:normal}
      .mxAdminBootCard h1{font-size:24px;margin:0 0 8px;color:#111}.mxAdminBootCard p{margin:0;color:#777d86;font-size:14px;line-height:1.7}
    </style>
    <script>
      if(location.pathname==='/admin.html') history.replaceState({},'',`/admin${location.search}${location.hash}`);
    </script>
  </head>
  <body>
    <div id="root">
      <main class="mxAdminBoot" dir="rtl">
        <section class="mxAdminBootCard">
          <div class="mxAdminBootLogo"><b>Mauri</b><i>One</i></div>
          <h1>لوحة التحكم</h1>
          <p>جارٍ تشغيل لوحة التحكم...</p>
        </section>
      </main>
    </div>
    <script>
      document.addEventListener('click',function(event){
        var target=event.target instanceof Element?event.target:null;
        if(!target)return;
        var action=target.closest('.mxAdminActions button');
        var back=target.closest('.mxAdminHeader > button:first-child');
        var openSite=action&&String(action.textContent||'').includes('فتح الموقع');
        if(!openSite&&!back)return;
        event.preventDefault();
        event.stopPropagation();
        if(event.stopImmediatePropagation)event.stopImmediatePropagation();
        try{localStorage.setItem('maurione_admin_preview_home','1')}catch(e){}
        window.location.assign('/?from=admin-preview&t='+Date.now());
      },true);
    </script>
    <script type="module" src="/admin-main.jsx"></script>
  </body>
</html>
