<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="لوحة التحكم" />
    <title>لوحة التحكم | MauriOne</title>
    <meta name="description" content="لوحة التحكم الخاصة بمالك MauriOne" />
    <meta name="robots" content="noindex,nofollow,noarchive" />
    <link rel="apple-touch-icon" sizes="180x180" href="https://res.cloudinary.com/bjlglhaw/image/upload/v1788117338/maurione-app-icon.png" />
    <link rel="icon" type="image/png" href="https://res.cloudinary.com/bjlglhaw/image/upload/v1788117338/maurione-app-icon.png" />
    <link rel="manifest" href="/admin-manifest.webmanifest?v=8" />
    <script>
      (()=>{
        const key='maurione_admin_theme';
        let choice='system';
        let theme='light';
        try{
          const saved=localStorage.getItem(key);
          if(saved==='dark'||saved==='light'||saved==='system')choice=saved;
        }catch(e){}
        if(choice==='dark')theme='dark';
        else if(choice==='light')theme='light';
        else if(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)theme='dark';
        document.documentElement.dataset.theme=theme;
        document.documentElement.dataset.adminThemeChoice=choice;
        document.documentElement.style.colorScheme=theme;
        const meta=document.querySelector('meta[name="theme-color"]');
        if(meta)meta.setAttribute('content',theme==='dark'?'#0d0f12':'#ffffff');
      })();
    </script>
    <style>
      html,body,#root{min-height:100%;background:#fff;margin:0}
      .mxAdminBoot{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box;background:#fff;font-family:Arial,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .mxAdminBootCard{width:min(100%,430px);box-sizing:border-box;padding:30px 24px 24px;border:1px solid #eceef1;border-radius:28px;background:#fff;box-shadow:0 20px 60px rgba(15,23,42,.10);text-align:center}
      .mxAdminBootLogo{font-size:34px;line-height:1;font-weight:900;direction:ltr;margin-bottom:28px;letter-spacing:-1.5px}.mxAdminBootLogo b{color:#090909}.mxAdminBootLogo i{color:#ff5a12;font-style:normal}
      .mxAdminBootCard h1{font-size:24px;margin:0 0 8px;color:#111}.mxAdminBootCard p{margin:0;color:#777d86;font-size:14px;line-height:1.7}
      html[data-theme='dark'],html[data-theme='dark'] body,html[data-theme='dark'] #root{background:#0d0f12!important;color:#f4f5f7!important}
      html[data-theme='dark'] .mxAdminBoot{background:#0d0f12!important}
      html[data-theme='dark'] .mxAdminBootCard{background:#15181c!important;border-color:#2c3138!important;box-shadow:0 20px 60px rgba(0,0,0,.38)!important}
      html[data-theme='dark'] .mxAdminBootLogo b{color:#f7f7f8!important}
      html[data-theme='dark'] .mxAdminBootCard h1{color:#f7f7f8!important}
      html[data-theme='dark'] .mxAdminBootCard p{color:#9ca3ad!important}
    </style>
    <script>
      if(location.pathname==='/admin.html') history.replaceState({},'',`/admin${location.search}${location.hash}`);
    </script>
  </head>
  <body>
    <div id="root">
      <main class="mxAdminBoot" dir="rtl">
        <section class="mxAdminBootCard">
          <div class="mxAdminBootLogo"><b>Mauri</b><i>One</i></div>
          <h1>لوحة التحكم</h1>
          <p>جارٍ تشغيل لوحة التحكم...</p>
        </section>
      </main>
    </div>
    <script>
      document.addEventListener('click',function(event){
        var target=event.target instanceof Element?event.target:null;
        if(!target)return;
        var action=target.closest('.mxAdminActions button');
        var back=target.closest('.mxAdminHeader > button:first-child');
        var openSite=action&&String(action.textContent||'').includes('فتح الموقع');
        if(!openSite&&!back)return;
        event.preventDefault();
        event.stopPropagation();
        if(event.stopImmediatePropagation)event.stopImmediatePropagation();
        try{localStorage.setItem('maurione_admin_preview_home','1')}catch(e){}
        window.location.assign('/?from=admin-preview&t='+Date.now());
      },true);
    </script>
    <script type="module" src="/admin-main.jsx"></script>
    <script type="module" src="/src/admin-settings.js"></script>
    <script type="module" src="/src/admin-settings-position.js"></script>
    <script type="module" src="/src/admin-team.js"></script>
    <script type="module" src="/src/enterprise-navigation-fix.js"></script>
    <script type="module" src="/src/enterprise-dashboard-polish.js"></script>
    <script type="module" src="/src/admin-whatsapp-icon-fix.js"></script>
  </body>
</html>
